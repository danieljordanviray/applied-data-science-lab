<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Applied Data Science Lab</title>
<style>
body { font-family: -apple-system, Georgia, serif; max-width: 760px; margin: 0 auto;
       padding: 40px 18px; line-height: 1.7; color: #1a1a1a; }
a { color: #1f6feb; }
.small { color: #555; }
#filter { width: 100%; font-size: 1rem; padding: 10px 14px; border: 1px solid #ccc;
          border-radius: 8px; margin: 18px 0 6px; font-family: inherit; }
h2.cat { margin-top: 2em; border-bottom: 1px solid #ddd; padding-bottom: 6px; font-size: 1.25em; }
.post { margin: 1em 0; }
.post a.title { font-size: 1.1em; font-weight: 600; text-decoration: none; }
.post a.title:hover { text-decoration: underline; }
.post p { margin: 4px 0; color: #333; }
.soon { color: #888; font-style: italic; }
.hidden { display: none; }
#noresults { display: none; color: #555; margin-top: 2em; }
</style></head><body>
<h1>Applied Data Science Lab</h1>
<p>Intuitive explanations of the data science techniques actually used in business —
each one applied to a real-world-style case, with code you can check. Written for
working professionals, not just quants.</p>

<input id="filter" type="text" placeholder="Filter topics… (try &quot;experiment&quot; or &quot;power&quot;)" aria-label="Filter topics">

<div id="index"></div>
<p id="noresults">No topics match that filter.</p>

<script>
const CATS = [
  ["stats-and-prob", "Stats & Probability"],
  ["experimentation", "Experimentation"],
  ["causal-inference", "Causal Inference"],
  ["machine-learning", "Machine Learning"],
];
const POSTS = [
  { cat: "stats-and-prob",
    title: "Statistical Significance, Visualized",
    url: "../stats-and-prob/p-values-power-playground/",
    desc: "An interactive playground: run experiments, move the sliders, and see what p-values and statistical power actually mean. No math degree required." },
  { cat: "causal-inference",
    title: "Difference-in-Differences",
    url: "../causal-inference/difference-in-differences/did-case-study.html",
    desc: "Did the program work? A state launches job training, a neighbor doesn't — learn the 2×2 intuition, the regression you'd run at work, and the checks that keep you honest." },
  { cat: "causal-inference",
    title: "Staggered Difference in Differences",
    url: "../causal-inference/difference-in-differences/did-staggered-case-study.html",
    desc: "When treatment arrives in waves: one honest comparison per rollout group, then averaged — plus a demo of how the naive one-big-regression invents effects that aren't there." },
];

const index = document.getElementById("index");
CATS.forEach(([key, label]) => {
  const posts = POSTS.filter(p => p.cat === key)
                     .sort((a, b) => a.title.localeCompare(b.title));
  const sec = document.createElement("section");
  sec.dataset.cat = key;
  const h = document.createElement("h2");
  h.className = "cat"; h.textContent = label;
  sec.appendChild(h);
  if (posts.length === 0) {
    const p = document.createElement("p");
    p.className = "soon"; p.textContent = "More studies coming soon.";
    sec.appendChild(p);
  } else {
    posts.forEach(p => {
      const d = document.createElement("div");
      d.className = "post";
      d.innerHTML = `<a class="title" href="${p.url}">${p.title}</a><p>${p.desc}</p>`;
      sec.appendChild(d);
    });
  }
  index.appendChild(sec);
});

const input = document.getElementById("filter");
input.addEventListener("input", () => {
  const q = input.value.trim().toLowerCase();
  let visible = 0;
  document.querySelectorAll("#index section").forEach(sec => {
    let secVisible = 0;
    sec.querySelectorAll(".post").forEach(post => {
      const hit = !q || post.textContent.toLowerCase().includes(q);
      post.classList.toggle("hidden", !hit);
      if (hit) secVisible++;
    });
    const soon = sec.querySelector(".soon");
    if (soon) soon.classList.toggle("hidden", !!q);
    const showSec = secVisible > 0 || (!q && soon);
    sec.classList.toggle("hidden", !showSec);
    if (showSec) visible++;
  });
  document.getElementById("noresults").style.display = visible ? "none" : "block";
});
</script>
</body></html>
